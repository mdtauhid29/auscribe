<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  
  <!-- Outer subtle glowing ring -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" />

  <!-- Microphone Icon Group with shadow -->
  <g filter="url(#shadow)">
    <!-- Mic Capsule -->
    <rect x="206" y="120" width="100" height="170" rx="50" fill="#ffffff" />
    
    <!-- Sound Waves / Frequency Lines on Mic -->
    <rect x="220" y="165" width="72" height="8" rx="4" fill="#6366f1" />
    <rect x="228" y="185" width="56" height="8" rx="4" fill="#6366f1" />
    <rect x="234" y="205" width="44" height="8" rx="4" fill="#6366f1" />

    <!-- Mic Cradle / Arc -->
    <path d="M166 230 C166 295 346 295 346 230" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />

    <!-- Stem & Base -->
    <line x1="256" y1="295" x2="256" y2="360" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
    <line x1="190" y1="360" x2="322" y2="360" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
  </g>

  <!-- Audio Waveform at bottom -->
  <g transform="translate(136, 400)">
    <rect x="0" y="20" width="14" height="30" rx="7" fill="url(#wave)" />
    <rect x="28" y="5" width="14" height="60" rx="7" fill="url(#wave)" />
    <rect x="56" y="15" width="14" height="40" rx="7" fill="url(#wave)" />
    <rect x="84" y="0" width="14" height="70" rx="7" fill="url(#wave)" />
    <rect x="112" y="22" width="14" height="26" rx="7" fill="url(#wave)" />
    <rect x="140" y="8" width="14" height="54" rx="7" fill="url(#wave)" />
    <rect x="168" y="18" width="14" height="34" rx="7" fill="url(#wave)" />
    <rect x="196" y="5" width="14" height="60" rx="7" fill="url(#wave)" />
    <rect x="224" y="22" width="14" height="26" rx="7" fill="url(#wave)" />
  </g>
</svg>
